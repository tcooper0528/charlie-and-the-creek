<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charlie and the Creek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF4E6; --cream-2:#F3E7CE;
    --rust:#B4552C; --rust-deep:#8E3F1E;
    --ink:#43291A; --acorn:#7A4A28;
    --shadow:0 18px 50px rgba(67,41,26,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%, #F7EAD0 0%, #EAD3AE 55%, #D8B98C 100%);
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;overflow:hidden;user-select:none;padding:16px;
  }

  /* ---- Book stage (square) ---- */
  .stage{
    position:relative;
    width:min(92vw, 88dvh, 720px);
    height:min(92vw, 88dvh, 720px);
    border-radius:18px;overflow:hidden;
    box-shadow:var(--shadow);background:#2c1a10;
  }
  .page{
    position:absolute;inset:0;opacity:0;transform:scale(1.02);
    transition:opacity .45s ease, transform .55s ease;
    pointer-events:none;z-index:1;
  }
  .page.active{opacity:1;transform:scale(1);z-index:2;pointer-events:auto;}
  .page img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---- Cover title overlay ---- */
  .cover-title{position:absolute;left:0;right:0;top:5%;text-align:center;padding:0 8%;z-index:3;pointer-events:none;}
  .cover-title h1{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(28px,7.8vw,54px);line-height:1.05;color:#5A2E14;
    text-shadow:0 1px 0 rgba(255,248,235,.85), 0 2px 14px rgba(255,248,235,.65);
  }
  .cover-title .sub{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;
    font-size:clamp(15px,4vw,24px);color:#7A3A1A;margin-top:.42em;
    text-shadow:0 1px 0 rgba(255,248,235,.9), 0 2px 8px rgba(255,248,235,.6);
  }
  .cover-foot{
    position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);
    z-index:3;pointer-events:none;text-align:center;white-space:nowrap;
    font-family:'Nunito',sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    font-size:clamp(10px,2.7vw,15px);color:#5A2E14;
    background:rgba(251,244,230,.92);
    border:1px solid rgba(180,85,44,.4);
    border-radius:22px;padding:8px 20px;
    box-shadow:0 4px 14px rgba(67,41,26,.28);
  }

  /* ---- Verse overlay (back page) ---- */
  .verse{
    position:absolute;left:50%;top:8%;transform:translate(-50%,0);
    width:82%;max-width:460px;z-index:3;pointer-events:none;
    background:rgba(251,244,230,.94);border:2px solid rgba(180,85,44,.5);
    border-radius:16px;padding:26px 26px 22px;text-align:center;
    box-shadow:0 10px 30px rgba(67,41,26,.3);
  }
  .verse p{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:clamp(16px,4.2vw,24px);line-height:1.4;color:var(--ink);}
  .verse .ref{font-family:'Nunito',sans-serif;font-style:normal;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(11px,2.8vw,14px);color:var(--rust-deep);margin-top:.9em;display:block;}

  /* ---- Caption card (placed in each page's quiet-space corner) ---- */
  .cap{
    position:absolute;z-index:3;pointer-events:none;max-width:72%;
    background:rgba(251,244,230,.92);border:1px solid rgba(180,85,44,.35);
    border-radius:14px;padding:14px 20px;
    font-family:'Fraunces',serif;font-weight:500;color:var(--ink);
    font-size:clamp(13px,3.15vw,19px);line-height:1.5;white-space:pre-line;
    box-shadow:0 6px 18px rgba(67,41,26,.22);
    opacity:0;transition:opacity .45s ease;
  }
  /* each line (a complete thought) gets a little air */
  .cap .ln{display:block;text-wrap:balance;}
  .cap .ln + .ln{margin-top:.4em;}
  .page.active .cap{opacity:1;}
  .cap.tl{top:4.5%;left:4.5%;text-align:left;}
  .cap.tr{top:4.5%;right:4.5%;text-align:left;}
  .cap.tc{top:4.5%;left:50%;transform:translateX(-50%);max-width:86%;text-align:center;}

  /* ============================================================
     MOBILE: turn the corner caption into a clean full-width band
     pinned to the TOP (over the sky / quiet space the art was
     composed with). Bigger text, one predictable location, and
     the picture below stays uncovered. Desktop keeps the card.
     ============================================================ */
  @media (max-width: 680px){
    .cap.tl, .cap.tr, .cap.tc{
      top:0; left:0; right:0; bottom:auto;
      transform:none;
      max-width:100%;
      text-align:center;
      border:none;
      border-radius:0 0 18px 18px;
      padding:16px 20px 18px;
      font-size:clamp(16px,4.6vw,21px);
      line-height:1.5;
      background:rgba(251,244,230,.96);
      box-shadow:0 8px 18px rgba(67,41,26,.22);
    }
    .cap .ln + .ln{margin-top:.35em;}
  }

  /* ---- Tap zones ---- */
  .zone{position:absolute;top:0;bottom:0;z-index:4;cursor:pointer;}
  .zone.prev{left:0;width:38%;}
  .zone.next{right:0;width:62%;}

  /* ---- Controls ---- */
  .bar{
    display:flex;align-items:center;gap:14px;width:min(92vw,88dvh,720px);
    margin-top:16px;padding:10px 16px;background:rgba(251,244,230,.92);
    border-radius:40px;box-shadow:0 6px 18px rgba(67,41,26,.18);
  }
  .nav{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    font-size:22px;line-height:1;background:var(--rust);color:var(--cream);
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease, background .2s ease;
  }
  .nav:hover{background:var(--rust-deep);}
  .nav:active{transform:scale(.9);}
  .nav:disabled{opacity:.35;cursor:default;background:var(--rust);}
  .track{position:relative;flex:1 1 auto;height:10px;border-radius:6px;background:var(--cream-2);}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--rust),#D08A4A);transition:width .4s ease;}
  .acorn{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:22px;transition:left .4s ease;filter:drop-shadow(0 1px 1px rgba(67,41,26,.4));}
  .count{flex:0 0 auto;font-weight:800;font-size:14px;color:var(--rust-deep);min-width:52px;text-align:center;font-variant-numeric:tabular-nums;}

  /* ---- First-time hint ---- */
  .hint{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;
    background:rgba(44,26,16,.7);color:var(--cream);font-weight:700;font-size:13px;
    padding:8px 16px;border-radius:20px;white-space:nowrap;transition:opacity .5s ease;pointer-events:none;
  }
  .hint.hide{opacity:0;}
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="hint" id="hint">Tap right to turn the page &rarr;</div>
  </div>

  <div class="bar">
    <button class="nav" id="prev" aria-label="Previous page">&lsaquo;</button>
    <div class="track"><div class="fill" id="fill"></div><span class="acorn" id="acorn">&#127808;</span></div>
    <span class="count" id="count">1 / 20</span>
    <button class="nav" id="next" aria-label="Next page">&rsaquo;</button>
  </div>

<script>
/* =========================================================
   CONFIG  —  edit here
   ========================================================= */
const BOOK = {
  showCoverTitle: true,
  title:    "Charlie and the Creek",
  subtitle: "A Sammy the Squirrel Story",
  imprint:  "A Pop's Workshop Story",
  verse:    "Children, obey your parents in the Lord, for this is right.",
  verseRef: "Ephesians 6:1",
};

/* Pages in order.  pos = which corner the caption sits in on
   DESKTOP (tl = top-left, tr = top-right, tc = top-center),
   matching the "quiet space" the art was composed with.
   On phones every caption becomes a clean top band automatically. */
const PAGES = [
  { file:"pages/00_covera.jpg", cover:true, alt:"Cover — Sammy and Charlie at the creek" },

  { file:"pages/01_pg01a.jpg", pos:"tl", alt:"Sammy at the big oak tree home", text:
`Sammy lived in a big oak tree.
He lived there with his mama.` },

  { file:"pages/02_pg02a.jpg", pos:"tr", alt:"Mama points toward the creek", text:
`"You may play in the meadow," said Mama.
"But do not cross the creek.
The water moves too fast."` },

  { file:"pages/03_pg03.jpg", pos:"tl", alt:"Sammy questions the rule", text:
`"But my friends play in the creek," said Sammy.
"Why do you make a rule that says I can't?"` },

  { file:"pages/04_pg04.jpg", pos:"tl", alt:"Sammy and Mama wave as he heads to play", text:
`"I have rules to keep you safe.
I do not want you to get hurt," said Mama.
"Rules keep us safe."
Sammy and Mama waved as he went to play.` },

  { file:"pages/05_pg05.jpg", pos:"tc", alt:"Tag in the meadow", text:
`Sammy thought about what Mama had said.
Then he ran to the meadow.
Bella and Charlie were there.
"Tag! You are it!" said Bella.` },

  { file:"pages/06_pg06.jpg", pos:"tc", alt:"Playing and laughing", text:
`They ran and ran.
They laughed and laughed.
It was a fun day.` },

  { file:"pages/07_pg07.jpg", pos:"tl", alt:"Charlie spots the stepping stones", text:
`Then Charlie saw the creek.
He saw the stepping stones.
"Let's cross!" said Charlie.` },

  { file:"pages/07b_pg07b.jpg", pos:"tc", alt:"The creek sweeps a leaf away", text:
`A leaf fell in the water.
Swoosh! The creek swept it away.
The water was strong and fast.` },

  { file:"pages/08_pg08.jpg", pos:"tr", alt:"Sammy wants to cross but chooses not to", text:
`Sammy wanted to cross too.
The stones looked like fun.
But he remembered Mama.
"No," said Sammy. "Rules keep us safe."
"I am not scared!" said Charlie.` },

  { file:"pages/09_pg09.jpg", pos:"tl", alt:"Charlie hops the wet stones", text:
`Charlie hopped from stone to stone.
Hop! Hop! Hop!
The stones were wet.` },

  { file:"pages/10_pg10.jpg", pos:"tc", alt:"Charlie falls in", text:
`SPLASH!
Charlie fell in the creek!
"Help!" cried Charlie.` },

  { file:"pages/11_pg11.jpg", pos:"tl", alt:"The rescue", text:
`Sammy grabbed a branch.
Bella held Sammy's paw.
They pulled and pulled.` },

  { file:"pages/12_pg12.jpg", pos:"tc", alt:"Safe on the bank", text:
`Charlie was scared but safe.
He was wet and cold.
"I am sorry, Sammy. You were right — the creek was not safe," said Charlie.` },

  { file:"pages/13_pg13.jpg", pos:"tr", alt:"Oliver Owl arrives", text:
`"Whooo goes there?"
It was Oliver Owl!
He flew down from the oak tree.` },

  { file:"pages/14_pg14.jpg", pos:"tl", alt:"Oliver teaches the friends", text:
`"Little ones," said Oliver,
"mamas and papas know what is best to keep us safe,
even when we do not know why."` },

  { file:"pages/15_pg15.jpg", pos:"tl", alt:"Obeying shows love", text:
`"When we obey our parents, we show them how much we love them."` },

  { file:"pages/16_pg16.jpg", pos:"tr", alt:"Home to Mama", text:
`Sammy ran home to Mama.
"Mama, you were right. Rules keep us safe," said Sammy.
"You obeyed!" said Mama. "I am so proud of you."` },

  { file:"pages/17_pg17.jpg", pos:"tl", alt:"Sammy's prayer", text:
`That night, Sammy prayed.
"Thank You, God, for Mama.
Thank You for rules that keep us safe. Amen."` },

  { file:"pages/18_back.jpg", verse:true, alt:"Back — the verse" },
];

/* =========================================================
   ENGINE
   ========================================================= */
const stage=document.getElementById('stage');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const fill=document.getElementById('fill');
const acorn=document.getElementById('acorn');
const count=document.getElementById('count');
const hint=document.getElementById('hint');
let i=0;

const els=PAGES.map((p,idx)=>{
  const d=document.createElement('div');
  d.className='page';d.dataset.idx=idx;
  const img=document.createElement('img');
  img.alt=p.alt||'';img.dataset.src=p.file;
  d.appendChild(img);

  if(p.cover && BOOK.showCoverTitle){
    const t=document.createElement('div');t.className='cover-title';
    t.innerHTML=`<h1>${BOOK.title}</h1>`+(BOOK.subtitle?`<div class="sub">${BOOK.subtitle}</div>`:'');
    d.appendChild(t);
    if(BOOK.imprint){const f=document.createElement('div');f.className='cover-foot';f.textContent=BOOK.imprint;d.appendChild(f);}
  }
  if(p.verse){
    const v=document.createElement('div');v.className='verse';
    v.innerHTML=`<p>&ldquo;${BOOK.verse}&rdquo;<span class="ref">${BOOK.verseRef}</span></p>`;
    d.appendChild(v);
  }
  if(p.text){
    const c=document.createElement('div');c.className='cap '+(p.pos||'tc');
    p.text.split('\n').forEach(line=>{
      const s=document.createElement('span');s.className='ln';s.textContent=line;
      c.appendChild(s);
    });
    d.appendChild(c);
  }
  stage.appendChild(d);
  return d;
});

function ensureLoaded(idx){
  [idx-1,idx,idx+1].forEach(n=>{
    if(n<0||n>=els.length)return;
    const img=els[n].querySelector('img');
    if(img&&!img.src&&img.dataset.src)img.src=img.dataset.src;
  });
}
function render(){
  els.forEach((el,n)=>el.classList.toggle('active',n===i));
  ensureLoaded(i);
  const pct=els.length>1?(i/(els.length-1))*100:0;
  fill.style.width=pct+'%';acorn.style.left=pct+'%';
  count.textContent=(i+1)+' / '+els.length;
  prevBtn.disabled=(i===0);nextBtn.disabled=(i===els.length-1);
}
function go(n){const t=Math.max(0,Math.min(els.length-1,n));if(t===i)return;i=t;render();}
function next(){go(i+1);dismissHint();}
function prev(){go(i-1);dismissHint();}
function dismissHint(){hint.classList.add('hide');}

const zPrev=document.createElement('div');zPrev.className='zone prev';
const zNext=document.createElement('div');zNext.className='zone next';
zPrev.addEventListener('click',prev);zNext.addEventListener('click',next);
stage.appendChild(zPrev);stage.appendChild(zNext);

prevBtn.addEventListener('click',prev);
nextBtn.addEventListener('click',next);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  if(e.key==='Home'){go(0);dismissHint();}
  if(e.key==='End'){go(els.length-1);dismissHint();}
});

let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();}
},{passive:true});

setTimeout(dismissHint,4200);
render();
</script>
</body>
</html>
